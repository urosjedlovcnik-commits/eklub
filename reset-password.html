<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo geslo — eKlub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body.login-page {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 50%, #e0e7ff 100%);
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 12px 40px rgba(37, 99, 235, 0.12);
        }
        .login-card h1 { margin: 0 0 8px; font-size: 24px; text-align: center; color: #1e3a8a; }
        .login-card .subtitle { text-align: center; color: var(--mut); font-size: 14px; margin-bottom: 24px; }
        .login-field { margin-bottom: 16px; }
        .login-field label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #334155; }
        .login-error {
            display: none;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
        }
        .login-success {
            display: none;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
        }
        .login-submit { width: 100%; padding: 12px; margin-top: 8px; }
        .login-hint {
            margin-top: 20px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 8px;
            font-size: 13px;
            color: #64748b;
            line-height: 1.5;
        }
    </style>
</head>
<body class="login-page">
    <div class="login-card">
        <h1>🏊 eKlub</h1>
        <p class="subtitle">Nastavite novo geslo</p>

        <div id="resetError" class="login-error"></div>
        <div id="resetSuccess" class="login-success"></div>

        <form id="resetForm">
            <div class="login-field">
                <label for="newPassword">Novo geslo</label>
                <input type="password" id="newPassword" required minlength="8" autocomplete="new-password" placeholder="Vsaj 8 znakov">
            </div>
            <div class="login-field">
                <label for="confirmPassword">Ponovite geslo</label>
                <input type="password" id="confirmPassword" required minlength="8" autocomplete="new-password" placeholder="••••••••">
            </div>
            <button type="submit" class="btn pri login-submit" id="resetBtn">Shrani novo geslo</button>
        </form>

        <div class="login-hint">
            Po shranjevanju boste preusmerjeni na koledar.<br>
            <a href="login.html">Nazaj na prijavo</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>
    <script src="./trainer-auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const resetForm = document.getElementById('resetForm');
            const resetBtn = document.getElementById('resetBtn');
            const resetError = document.getElementById('resetError');
            const resetSuccess = document.getElementById('resetSuccess');
            const supabase = trainerAuth.supabase;
            let ready = false;

            function showError(msg) {
                resetError.textContent = msg;
                resetError.style.display = 'block';
                resetSuccess.style.display = 'none';
            }

            function showSuccess(msg) {
                resetSuccess.textContent = msg;
                resetSuccess.style.display = 'block';
                resetError.style.display = 'none';
            }

            const authReady = new Promise((resolve) => {
                const timeout = setTimeout(() => resolve(false), 4000);
                const { data: { subscription } } = supabase.auth.onAuthStateChange((event, session) => {
                    if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) {
                        ready = true;
                        clearTimeout(timeout);
                        subscription.unsubscribe();
                        resolve(true);
                    }
                });
            });

            await supabase.auth.getSession();
            const fromEvent = await authReady;
            const { data: { session } } = await supabase.auth.getSession();
            ready = ready || fromEvent || !!session;

            if (!ready) {
                showError('Povezava je neveljavna ali je potekla. Pojdite na prijavo in znova zahtevajte «Pozabljeno geslo?».');
                resetForm.hidden = true;
                resetBtn.disabled = true;
            }

            resetForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                resetError.style.display = 'none';
                resetSuccess.style.display = 'none';

                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (newPassword.length < 8) {
                    showError('Geslo mora imeti vsaj 8 znakov.');
                    return;
                }
                if (newPassword !== confirmPassword) {
                    showError('Gesli se ne ujemata.');
                    return;
                }

                resetBtn.disabled = true;
                resetBtn.textContent = 'Shranjevanje …';

                try {
                    const { error } = await supabase.auth.updateUser({ password: newPassword });
                    if (error) throw error;

                    history.replaceState(null, '', window.location.pathname);
                    await trainerAuth.restoreSession();
                    showSuccess('Novo geslo je shranjeno. Preusmerjam na koledar …');
                    setTimeout(() => { window.location.href = './index.html'; }, 900);
                } catch (err) {
                    showError(err.message || 'Shranjevanje gesla ni uspelo.');
                    resetBtn.disabled = false;
                    resetBtn.textContent = 'Shrani novo geslo';
                }
            });
        });
    </script>
</body>
</html>
