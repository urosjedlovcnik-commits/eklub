<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vodenje prisotnosti - PKL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Vodenje prisotnosti - PKL</h1>
    </header>

    <main>
        <div class="content">
            <div class="box-panel calendar-panel">
                <section>
                    <div class="calendar-header">
                        <button id="prevBtn" class="btn neutral">&lt;</button>
                        <h2 id="monthLabel"></h2>
                        <button id="nextBtn" class="btn neutral">&gt;</button>
                    </div>
                    <div class="calendar-grid-labels">
                        <span>Pon.</span>
                        <span>Tor.</span>
                        <span>Sre.</span>
                        <span>Čet.</span>
                        <span>Pet.</span>
                        <span>Sob.</span>
                        <span>Ned.</span>
                    </div>
                    <div id="calendarGrid" class="calendar-grid"></div>
                </section>
            </div>
            
            <div class="box-panel summary-panel">
                <section class="summary">
                    <h2>Povzetek prisotnosti</h2>
                    <div id="summaryBox" class="summary-content"></div>
                </section>
            </div>

            <div class="sidebar">
                <div class="box-panel">
                    <section>
                        <h2>Dodaj plavalca</h2>
                        <div class="form-group">
                            <label for="newFirst">Ime:</label>
                            <input type="text" id="newFirst" placeholder="Ime">
                        </div>
                        <div class="form-group">
                            <label for="newLast">Priimek:</label>
                            <input type="text" id="newLast" placeholder="Priimek">
                        </div>
                        <div class="form-group">
                             <button id="addSwimmerBtn" class="btn primary-btn">Dodaj plavalca</button>
                        </div>
                    </section>
                </div>
                
                <div class="box-panel">
                  <section>
                    <h2>Povezava</h2>
                      <div class="form-group">
                        <label for="swimmerSelect">Plavalec:</label>
                        <select id="swimmerSelect"></select>
                      </div>
                      <div class="form-group">
                        <label for="termSelect">Termin:</label>
                        <select id="termSelect"></select>
                      </div>
                      <button id="assignTermBtn" class="btn primary-btn">Deli termin</button>
                  </section>
                </div>

                <div class="box-panel">
                    <section>
                        <h2>Uvoz CSV</h2>
                        <div class="form-group">
                            <label for="csvInput">Uvozi plavalce (csv):</label>
                            <input type="file" id="csvInput" accept=".csv">
                        </div>
                        <div class="form-group">
                            <label for="csvTermsInput">Uvozi termine (csv):</label>
                            <input type="file" id="csvTermsInput" accept=".csv">
                        </div>
                    </section>
                </div>

                <div class="box-panel">
                    <section>
                        <h2>Izvoz CSV</h2>
                        <div class="form-group">
                            <label for="exportMonthSelect">Mesec:</label>
                            <select id="exportMonthSelect"></select>
                        </div>
                        <div class="form-group">
                            <label for="exportYearSelect">Leto:</label>
                            <select id="exportYearSelect"></select>
                        </div>
                        <button id="exportCsvBtn" class="btn secondary-btn">Izvozi v CSV</button>
                    </section>
                </div>
                
                <div class="box-panel">
                    <section>
                        <h2>Dodaj termin</h2>
                        <div class="form-group">
                            <label for="newTermDay">Dan:</label>
                            <input type="text" id="newTermDay" placeholder="npr. pon, sre, pet">
                        </div>
                        <div class="form-group">
                            <label for="newTermStart">Začetek:</label>
                            <input type="time" id="newTermStart">
                        </div>
                        <div class="form-group">
                            <label for="newTermEnd">Konec:</label>
                            <input type="time" id="newTermEnd">
                        </div>
                        <div class="form-group">
                            <label for="newTermDateFrom">Datum od:</label>
                            <input type="text" id="newTermDateFrom" placeholder="dd / mm / yyyy">
                        </div>
                        <div class="form-group">
                            <label for="newTermDateTo">Datum do:</label>
                            <input type="text" id="newTermDateTo" placeholder="dd / mm / yyyy">
                        </div>
                        <button id="addTermBtn" class="btn primary-btn">Dodaj termin</button>
                    </section>
                </div>

                <div class="box-panel">
                  <section>
                    <h2>Plavalci</h2>
                    <div id="swimmerInfo"></div>
                    <button id="deleteSwimmerBtn" class="btn warn">Izbriši plavalca</button>
                  </section>
                </div>
            </div>

            <div id="eventModal" class="modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3 id="modalTitle"></h3>
                        <button id="closeModalBtn" class="close-btn">&times;</button>
                    </div>
                    <div class="modal-body">
                        <p id="modalMeta"></p>
                        <p id="inactiveNote"></p>
                        <table class="table" id="attendanceTable">
                            <thead>
                                <tr>
                                    <th>Plavalec</th>
                                    <th>Prisotnost</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                        <div class="form-group mt-2">
                          <label for="modalSwimmerSelect">Dodaj plavalca v ta termin:</label>
                          <select id="modalSwimmerSelect"></select>
                          <button id="addToEventBtn" class="btn primary-btn">Dodaj</button>
                        </div>
                        <div class="form-group mt-2">
                           <textarea id="notesInput" placeholder="Vnesi opombo..."></textarea>
                           <button id="saveNotesBtn" class="btn primary-btn">Shrani opombo</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div id="dayModal" class="modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3 id="dayModalTitle"></h3>
                        <span class="close-btn" id="closeDayModalBtn">&times;</span>
                    </div>
                    <div class="modal-body" id="dayModalList">
                    </div>
                </div>
            </div>

            <div id="editTermModal" class="modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3 id="editTermModalTitle"></h3>
                        <button id="closeEditTermModalBtn" class="close-btn">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div class="form-group">
                            <label for="editTermDateFrom">Datum od:</label>
                            <input type="text" id="editTermDateFrom" placeholder="dd / mm / yyyy">
                        </div>
                        <div class="form-group">
                            <label for="editTermDateTo">Datum do:</label>
                            <input type="text" id="editTermDateTo" placeholder="dd / mm / yyyy">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button id="saveEditTermBtn" class="btn primary-btn">Shrani spremembe</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
