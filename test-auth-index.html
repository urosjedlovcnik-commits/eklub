<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Auth Index</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        iframe { width: 100%; height: 600px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <h1>Test Auth Index</h1>
    
    <div class="test-section info">
        <h3>Test auth-index.html</h3>
        <p>Odprite auth-index.html v novem oknu in preverite, ali deluje prijava.</p>
        <button onclick="openAuthIndex()">Odpri auth-index.html</button>
        <button onclick="openTestLogin()">Odpri test-login.html</button>
    </div>
    
    <div class="test-section info">
        <h3>Primerjava</h3>
        <p>Primerjajte delovanje auth-index.html z test-login.html, ki deluje.</p>
    </div>

    <script>
        function openAuthIndex() {
            window.open('auth-index.html', '_blank');
        }
        
        function openTestLogin() {
            window.open('test-login.html', '_blank');
        }
    </script>
</body>
</html>
