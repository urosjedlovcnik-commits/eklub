<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Login - Plavalna šola</title>
<link rel="stylesheet" href="style.css">
<style>
.login-container {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  padding: 20px;
}

.login-box {
  background: white;
  border-radius: 16px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.1);
  padding: 40px;
  width: 100%;
  max-width: 400px;
  text-align: center;
}

.login-logo {
  margin-bottom: 30px;
}

.login-logo h1 {
  color: #2563eb;
  font-size: 28px;
  margin: 0;
}

.login-logo p {
  color: #6b7280;
  margin: 10px 0 0 0;
  font-size: 14px;
}

.login-form {
  text-align: left;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  color: #374151;
  font-weight: 500;
  font-size: 14px;
}

.form-group input {
  width: 100%;
  padding: 12px 16px;
  border: 2px solid #e5e7eb;
  border-radius: 8px;
  font-size: 16px;
  transition: border-color 0.2s;
  box-sizing: border-box;
}

.form-group input:focus {
  outline: none;
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}

.login-btn {
  width: 100%;
  padding: 14px;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: background-color 0.2s;
  margin-top: 10px;
}

.login-btn:hover {
  background: #1d4ed8;
}

.login-btn:disabled {
  background: #9ca3af;
  cursor: not-allowed;
}

.error-message {
  background: #fef2f2;
  border: 1px solid #fecaca;
  color: #dc2626;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 20px;
  font-size: 14px;
  display: none;
}

.back-link {
  margin-top: 20px;
  text-align: center;
}

.back-link a {
  color: #6b7280;
  text-decoration: none;
  font-size: 14px;
}

.back-link a:hover {
  color: #374151;
}

@media (max-width: 480px) {
  .login-box {
    padding: 30px 20px;
    margin: 20px;
  }
  
  .login-logo h1 {
    font-size: 24px;
  }
}
</style>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="login-logo">
        <h1>🔐 Admin Login</h1>
        <p>Plavalna šola - Administracija</p>
      </div>
      
      <div id="errorMessage" class="error-message"></div>
      
      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label for="email">E-pošta</label>
          <input type="email" id="email" name="email" required placeholder="vnesite vaš email">
        </div>
        
        <div class="form-group">
          <label for="password">Geslo</label>
          <input type="password" id="password" name="password" required placeholder="vnesite geslo">
        </div>
        
        <button type="submit" class="login-btn" id="loginBtn">
          Prijava
        </button>
      </form>
      
      <div class="back-link">
        <a href="index.html">← Nazaj na glavno stran</a>
      </div>
    </div>
  </div>

  <script src="./config.js"></script>
  <script src="./auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('loginForm');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const loginBtn = document.getElementById('loginBtn');
      const errorMessage = document.getElementById('errorMessage');
      
      // Preveri, če je uporabnik že prijavljen
      authManager.ensureAuthenticated().then(session => {
        if (session) window.location.href = 'admin.html';
      });
      
      function showError(message) {
        errorMessage.textContent = message;
        errorMessage.style.display = 'block';
        setTimeout(() => {
          errorMessage.style.display = 'none';
        }, 5000);
      }
      
      function setLoading(loading) {
        loginBtn.disabled = loading;
        loginBtn.textContent = loading ? 'Prijavljanje...' : 'Prijava';
      }
      
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        
        if (!email || !password) {
          showError('Prosim izpolnite vsa polja');
          return;
        }
        
        setLoading(true);
        
        try {
          await authManager.loginAdmin(email, password);
          window.location.href = 'admin.html';
        } catch (error) {
          showError(error.message);
        } finally {
          setLoading(false);
        }
      });
      
      // Dodaj Enter tipko podporo
      passwordInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          loginForm.dispatchEvent(new Event('submit'));
        }
      });
    });
  </script>
</body>
</html>
