<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Debug Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .error { color: red; }
        .success { color: green; }
        .info { color: blue; }
        .warning { color: orange; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Auth Debug Test</h1>
    <div id="output"></div>

    <script>
        const output = document.getElementById('output');

        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = type;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            output.appendChild(div);
            console.log(message);
        }

        function testAuthIndex() {
            log('=== TESTING AUTH INDEX ELEMENTS ===', 'info');
            
            // Test 1: Load auth-index.html in iframe
            log('Test 1: Loading auth-index.html...', 'info');
            const iframe = document.createElement('iframe');
            iframe.src = 'auth-index.html';
            iframe.style.width = '100%';
            iframe.style.height = '600px';
            iframe.style.border = '1px solid #ccc';
            document.body.appendChild(iframe);
            
            iframe.onload = function() {
                log('auth-index.html loaded successfully', 'success');
                
                try {
                    // Test 2: Check if we can access elements
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    
                    // Check login elements
                    const loginScreen = iframeDoc.getElementById('loginScreen');
                    const mainApp = iframeDoc.getElementById('mainApp');
                    const loginForm = iframeDoc.getElementById('loginForm');
                    const emailInput = iframeDoc.getElementById('emailInput');
                    const passwordInput = iframeDoc.getElementById('passwordInput');
                    
                    if (loginScreen) log('✓ loginScreen found', 'success');
                    else log('✗ loginScreen NOT found', 'error');
                    
                    if (mainApp) log('✓ mainApp found', 'success');
                    else log('✗ mainApp NOT found', 'error');
                    
                    if (loginForm) log('✓ loginForm found', 'success');
                    else log('✗ loginForm NOT found', 'error');
                    
                    if (emailInput) log('✓ emailInput found', 'success');
                    else log('✗ emailInput NOT found', 'error');
                    
                    if (passwordInput) log('✓ passwordInput found', 'success');
                    else log('✗ passwordInput NOT found', 'error');
                    
                    // Check calendar elements
                    const monthLabel = iframeDoc.getElementById('monthLabel');
                    const calendarGrid = iframeDoc.getElementById('calendarGrid');
                    
                    if (monthLabel) log('✓ monthLabel found', 'success');
                    else log('✗ monthLabel NOT found', 'error');
                    
                    if (calendarGrid) log('✓ calendarGrid found', 'success');
                    else log('✗ calendarGrid NOT found', 'error');
                    
                    // Check if scripts are loaded
                    const scripts = iframeDoc.querySelectorAll('script');
                    log(`Found ${scripts.length} script tags`, 'info');
                    
                    scripts.forEach((script, index) => {
                        if (script.src) {
                            log(`Script ${index + 1}: ${script.src}`, 'info');
                        } else {
                            log(`Script ${index + 1}: inline script`, 'info');
                        }
                    });
                    
                } catch (error) {
                    log(`Error accessing iframe content: ${error.message}`, 'error');
                    log('This might be due to CORS restrictions', 'warning');
                }
            };
            
            iframe.onerror = function() {
                log('Failed to load auth-index.html', 'error');
            };
        }

        // Run test when page loads
        testAuthIndex();
    </script>
</body>
</html>
