<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prijava — eKlub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body.login-page {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 50%, #e0e7ff 100%);
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 12px 40px rgba(37, 99, 235, 0.12);
        }
        .login-card h1 {
            margin: 0 0 8px;
            font-size: 24px;
            text-align: center;
            color: #1e3a8a;
        }
        .login-card .subtitle {
            text-align: center;
            color: var(--mut);
            font-size: 14px;
            margin-bottom: 24px;
        }
        .login-field {
            margin-bottom: 16px;
        }
        .login-field label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #334155;
        }
        .login-error {
            display: none;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
        }
        .login-submit {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
        }
        .login-hint {
            margin-top: 20px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 8px;
            font-size: 13px;
            color: #64748b;
            line-height: 1.5;
        }
    </style>
</head>
<body class="login-page">
    <div class="login-card">
        <h1>🏊 eKlub</h1>
        <p class="subtitle" id="loginSubtitle">Prijava za trenerje</p>

        <div id="loginError" class="login-error"></div>

        <div id="recoveryFormWrap" hidden>
            <form id="recoveryForm">
                <div class="login-field">
                    <label for="newPassword">Novo geslo</label>
                    <input type="password" id="newPassword" required minlength="8" autocomplete="new-password" placeholder="Vsaj 8 znakov">
                </div>
                <div class="login-field">
                    <label for="confirmPassword">Ponovite geslo</label>
                    <input type="password" id="confirmPassword" required minlength="8" autocomplete="new-password" placeholder="••••••••">
                </div>
                <button type="submit" class="btn pri login-submit" id="recoveryBtn">Shrani novo geslo</button>
            </form>
        </div>

        <form id="loginForm">
            <div class="login-field">
                <label for="email">E-pošta</label>
                <input type="email" id="email" required autocomplete="username" placeholder="vas@email.si">
            </div>
            <div class="login-field">
                <label for="password">Geslo</label>
                <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
            </div>
            <button type="submit" class="btn pri login-submit" id="loginBtn">Prijava</button>
            </form>

            <p style="text-align:center;margin-top:14px;font-size:14px">
                <button type="button" class="btn" id="forgotPasswordBtn" style="background:transparent;border:none;color:#2563eb;text-decoration:underline;cursor:pointer;padding:0">
                    Pozabljeno geslo?
                </button>
            </p>

            <div id="loginSuccess" class="login-error" style="display:none;background:#f0fdf4;border-color:#bbf7d0;color:#166534"></div>

        <div class="login-hint">
            Dostop imajo le registrirani trenerji.<br>
            <strong>Geslo za koledar</strong> nastavite v Supabase ali uporabite «Pozabljeno geslo?».<br>
            To <em>ni</em> isto geslo kot za admin panel (Vercel).
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>
    <script src="./trainer-auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const form = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const loginError = document.getElementById('loginError');
            const loginSuccess = document.getElementById('loginSuccess');
            const forgotBtn = document.getElementById('forgotPasswordBtn');
            const recoveryWrap = document.getElementById('recoveryFormWrap');
            const recoveryForm = document.getElementById('recoveryForm');
            const recoveryBtn = document.getElementById('recoveryBtn');
            const loginSubtitle = document.getElementById('loginSubtitle');
            const loginHint = document.querySelector('.login-hint');

            const params = new URLSearchParams(window.location.search);
            const returnTo = params.get('return') || 'index.html';
            let passwordRecoveryMode = false;

            function isRecoveryUrl() {
                const hash = (window.location.hash || '').replace(/^#/, '');
                const hashParams = new URLSearchParams(hash);
                if (hashParams.get('type') === 'recovery') return true;
                return params.get('type') === 'recovery';
            }

            function showRecoveryForm() {
                passwordRecoveryMode = true;
                form.hidden = true;
                if (forgotBtn) forgotBtn.closest('p').hidden = true;
                if (loginHint) loginHint.hidden = true;
                recoveryWrap.hidden = false;
                if (loginSubtitle) loginSubtitle.textContent = 'Nastavite novo geslo';
            }

            function redirectAfterLogin() {
                const target = returnTo.startsWith('/') ? returnTo : './' + returnTo.replace(/^\.\//, '');
                if (returnTo.includes('admin') && !trainerAuth.permissions?.canAccessAdmin) {
                    window.location.href = './index.html';
                    return;
                }
                window.location.href = target;
            }

            trainerAuth.supabase.auth.onAuthStateChange((event) => {
                if (event === 'PASSWORD_RECOVERY') {
                    showRecoveryForm();
                }
            });

            if (isRecoveryUrl()) {
                showRecoveryForm();
            }

            const existing = await trainerAuth.restoreSession();
            if (existing && !passwordRecoveryMode) {
                redirectAfterLogin();
                return;
            }

            if (recoveryForm) {
                recoveryForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    loginError.style.display = 'none';
                    loginSuccess.style.display = 'none';

                    const newPassword = document.getElementById('newPassword').value;
                    const confirmPassword = document.getElementById('confirmPassword').value;

                    if (newPassword.length < 8) {
                        loginError.textContent = 'Geslo mora imeti vsaj 8 znakov.';
                        loginError.style.display = 'block';
                        return;
                    }
                    if (newPassword !== confirmPassword) {
                        loginError.textContent = 'Gesli se ne ujemata.';
                        loginError.style.display = 'block';
                        return;
                    }

                    recoveryBtn.disabled = true;
                    recoveryBtn.textContent = 'Shranjevanje …';

                    try {
                        const { error } = await trainerAuth.supabase.auth.updateUser({ password: newPassword });
                        if (error) throw error;

                        history.replaceState(null, '', window.location.pathname + window.location.search);
                        await trainerAuth.restoreSession();

                        loginSuccess.textContent = 'Novo geslo je shranjeno. Preusmerjam …';
                        loginSuccess.style.display = 'block';
                        setTimeout(() => redirectAfterLogin(), 800);
                    } catch (err) {
                        loginError.textContent = err.message || 'Shranjevanje gesla ni uspelo.';
                        loginError.style.display = 'block';
                        recoveryBtn.disabled = false;
                        recoveryBtn.textContent = 'Shrani novo geslo';
                    }
                });
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                loginError.style.display = 'none';
                loginSuccess.style.display = 'none';
                loginBtn.disabled = true;
                loginBtn.textContent = 'Prijavljanje …';

                try {
                    await trainerAuth.login(emailInput.value.trim(), passwordInput.value);
                    redirectAfterLogin();
                } catch (err) {
                    loginError.textContent = err.message || 'Prijava ni uspela.';
                    loginError.style.display = 'block';
                } finally {
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Prijava';
                }
            });

            if (forgotBtn) {
                forgotBtn.addEventListener('click', async () => {
                    const email = emailInput.value.trim();
                    if (!email) {
                        loginError.textContent = 'Najprej vnesite email, nato kliknite Pozabljeno geslo.';
                        loginError.style.display = 'block';
                        return;
                    }
                    forgotBtn.disabled = true;
                    try {
                        const { error } = await trainerAuth.supabase.auth.resetPasswordForEmail(email, {
                            redirectTo: window.location.origin + '/login.html'
                        });
                        if (error) throw error;
                        loginSuccess.textContent = 'Poslali smo povezavo za novo geslo na ' + email + '. Preverite tudi mapo vsiljena.';
                        loginSuccess.style.display = 'block';
                    } catch (err) {
                        loginError.textContent = err.message || 'Pošiljanje ni uspelo.';
                        loginError.style.display = 'block';
                    } finally {
                        forgotBtn.disabled = false;
                    }
                });
            }
        });
    </script>
</body>
</html>
