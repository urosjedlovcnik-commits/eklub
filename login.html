<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prijava — eKlub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body.login-page {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 50%, #e0e7ff 100%);
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 12px 40px rgba(37, 99, 235, 0.12);
        }
        .login-card h1 {
            margin: 0 0 8px;
            font-size: 24px;
            text-align: center;
            color: #1e3a8a;
        }
        .login-card .subtitle {
            text-align: center;
            color: var(--mut);
            font-size: 14px;
            margin-bottom: 24px;
        }
        .login-field {
            margin-bottom: 16px;
        }
        .login-field label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #334155;
        }
        .login-error {
            display: none;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
        }
        .login-submit {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
        }
        .login-hint {
            margin-top: 20px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 8px;
            font-size: 13px;
            color: #64748b;
            line-height: 1.5;
        }
    </style>
</head>
<body class="login-page">
    <div class="login-card">
        <h1>🏊 eKlub</h1>
        <p class="subtitle">Prijava za trenerje</p>

        <div id="loginError" class="login-error"></div>

        <form id="loginForm">
            <div class="login-field">
                <label for="email">E-pošta</label>
                <input type="email" id="email" required autocomplete="username" placeholder="vas@email.si">
            </div>
            <div class="login-field">
                <label for="password">Geslo</label>
                <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
            </div>
            <button type="submit" class="btn pri login-submit" id="loginBtn">Prijava</button>
            </form>

            <p style="text-align:center;margin-top:14px;font-size:14px">
                <button type="button" class="btn" id="forgotPasswordBtn" style="background:transparent;border:none;color:#2563eb;text-decoration:underline;cursor:pointer;padding:0">
                    Pozabljeno geslo?
                </button>
            </p>

            <div id="loginSuccess" class="login-error" style="display:none;background:#f0fdf4;border-color:#bbf7d0;color:#166534"></div>

        <div class="login-hint">
            Dostop imajo le registrirani trenerji.<br>
            <strong>Geslo za koledar</strong> nastavite v Supabase ali uporabite «Pozabljeno geslo?».<br>
            <a href="NAVODILA_UCITELJI.html">Kratka navodila za učitelje</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>
    <script src="./trainer-auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const form = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const loginError = document.getElementById('loginError');
            const loginSuccess = document.getElementById('loginSuccess');
            const forgotBtn = document.getElementById('forgotPasswordBtn');

            const params = new URLSearchParams(window.location.search);
            const returnTo = params.get('return') || 'index.html';

            if (typeof isRecoveryUrl === 'function' && isRecoveryUrl()) {
                window.location.replace('./reset-password.html' + window.location.search + window.location.hash);
                return;
            }

            function redirectAfterLogin() {
                const target = returnTo.startsWith('/') ? returnTo : './' + returnTo.replace(/^\.\//, '');
                if (returnTo.includes('admin') && !trainerAuth.permissions?.canAccessAdmin) {
                    window.location.href = './index.html';
                    return;
                }
                window.location.href = target;
            }

            const existing = await trainerAuth.restoreSession();
            if (existing) {
                redirectAfterLogin();
                return;
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                loginError.style.display = 'none';
                loginSuccess.style.display = 'none';
                loginBtn.disabled = true;
                loginBtn.textContent = 'Prijavljanje …';

                try {
                    await trainerAuth.login(emailInput.value.trim(), passwordInput.value);
                    redirectAfterLogin();
                } catch (err) {
                    loginError.textContent = err.message || 'Prijava ni uspela.';
                    loginError.style.display = 'block';
                } finally {
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Prijava';
                }
            });

            if (forgotBtn) {
                forgotBtn.addEventListener('click', async () => {
                    const email = emailInput.value.trim();
                    if (!email) {
                        loginError.textContent = 'Najprej vnesite email, nato kliknite Pozabljeno geslo.';
                        loginError.style.display = 'block';
                        return;
                    }
                    forgotBtn.disabled = true;
                    try {
                        const { error } = await trainerAuth.supabase.auth.resetPasswordForEmail(email, {
                            redirectTo: window.location.origin + '/reset-password.html'
                        });
                        if (error) throw error;
                        loginSuccess.textContent = 'Poslali smo povezavo za novo geslo na ' + email + '. Preverite tudi mapo vsiljena.';
                        loginSuccess.style.display = 'block';
                    } catch (err) {
                        loginError.textContent = err.message || 'Pošiljanje ni uspelo.';
                        loginError.style.display = 'block';
                    } finally {
                        forgotBtn.disabled = false;
                    }
                });
            }
        });
    </script>
</body>
</html>
