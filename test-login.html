<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test prijave</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
        pre {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 3px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Test prijave - Diagnostika</h1>
    
    <div class="test-section info">
        <h3>1. Preveri povezavo s Supabase</h3>
        <button onclick="testConnection()">Testiraj povezavo</button>
        <div id="connectionResult"></div>
    </div>
    
    <div class="test-section info">
        <h3>2. Test prijave</h3>
        <form id="loginForm">
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" required>
            </div>
            <div>
                <label for="password">Geslo:</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Prijavi se</button>
        </form>
        <div id="loginResult"></div>
    </div>
    
    <div class="test-section info">
        <h3>3. Preveri trenerja v bazi</h3>
        <button onclick="checkTrainer()">Preveri trenerja</button>
        <div id="trainerResult"></div>
    </div>
    
    <div class="test-section info">
        <h3>4. Preveri termine trenerja</h3>
        <button onclick="checkTerms()">Preveri termine</button>
        <div id="termsResult"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://tizjimlwfkoniixbetgr.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpemppbWx3ZmtvbmlpeGJldGdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTUzNDgyNzgsImV4cCI6MjA3MDkyNDI3OH0.Oess7TCevLH3mO0aWxfL5M0Kb_XHEKUBYRYRXKQkdgk";

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUser = null;

        async function testConnection() {
            const resultDiv = document.getElementById('connectionResult');
            resultDiv.innerHTML = '<p>Testiram povezavo...</p>';
            
            try {
                const { data, error } = await supabase.from('trainers').select('count').limit(1);
                
                if (error) {
                    resultDiv.innerHTML = `<div class="error"><strong>Napaka:</strong> ${error.message}</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="success"><strong>Uspešno!</strong> Povezava z bazo deluje.</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error"><strong>Napaka:</strong> ${error.message}</div>`;
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('loginResult');
            
            resultDiv.innerHTML = '<p>Prijavljam...</p>';
            
            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                if (error) {
                    resultDiv.innerHTML = `<div class="error"><strong>Napaka prijave:</strong> ${error.message}</div>`;
                } else {
                    currentUser = data.user;
                    resultDiv.innerHTML = `<div class="success">
                        <strong>Uspešna prijava!</strong><br>
                        Email: ${data.user.email}<br>
                        ID: ${data.user.id}
                    </div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error"><strong>Napaka:</strong> ${error.message}</div>`;
            }
        });

        async function checkTrainer() {
            const resultDiv = document.getElementById('trainerResult');
            
            if (!currentUser) {
                resultDiv.innerHTML = '<div class="error">Najprej se prijavite!</div>';
                return;
            }
            
            resultDiv.innerHTML = '<p>Preverjam trenerja...</p>';
            
            try {
                const { data, error } = await supabase
                    .from('trainers')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .single();
                
                if (error) {
                    resultDiv.innerHTML = `<div class="error"><strong>Napaka:</strong> ${error.message}</div>`;
                } else if (!data) {
                    resultDiv.innerHTML = '<div class="error">Trener ni najden v bazi!</div>';
                } else {
                    resultDiv.innerHTML = `<div class="success">
                        <strong>Trener najden!</strong><br>
                        Ime: ${data.first_name} ${data.last_name}<br>
                        Email: ${data.email}<br>
                        ID: ${data.id}
                    </div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error"><strong>Napaka:</strong> ${error.message}</div>`;
            }
        }

        async function checkTerms() {
            const resultDiv = document.getElementById('termsResult');
            
            if (!currentUser) {
                resultDiv.innerHTML = '<div class="error">Najprej se prijavite!</div>';
                return;
            }
            
            resultDiv.innerHTML = '<p>Preverjam termine...</p>';
            
            try {
                // Najprej poiščemo trenerja
                const { data: trainerData, error: trainerError } = await supabase
                    .from('trainers')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .single();
                
                if (trainerError || !trainerData) {
                    resultDiv.innerHTML = '<div class="error">Trener ni najden!</div>';
                    return;
                }
                
                // Nato poiščemo termine
                const { data: termsData, error: termsError } = await supabase
                    .from('trainer_terms')
                    .select('term_id')
                    .eq('trainer_id', trainerData.id);
                
                if (termsError) {
                    resultDiv.innerHTML = `<div class="error"><strong>Napaka:</strong> ${termsError.message}</div>`;
                } else {
                    const termIds = termsData.map(t => t.term_id);
                    resultDiv.innerHTML = `<div class="success">
                        <strong>Termini najdeni!</strong><br>
                        Število terminov: ${termIds.length}<br>
                        ID-ji terminov: ${termIds.join(', ') || 'Ni terminov'}
                    </div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error"><strong>Napaka:</strong> ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
